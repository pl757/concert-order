<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单后台 - 演唱会下单工作台</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f6f8;color:#222}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input,select{padding:10px;border:1px solid #ddd;border-radius:10px;font-size:14px}
.badge{background:#e60023;color:#fff;border-radius:999px;padding:2px 8px;font-size:12px}
.live{color:#07a35a;font-size:13px}.live i{display:inline-block;width:8px;height:8px;background:#07a35a;border-radius:50%;margin-right:4px}
.card{background:#fff;border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card.new{border:2px solid #e60023}
.card h3{margin:0 0 6px}.meta{color:#666;font-size:13px;line-height:1.7}
.meta b{color:#222}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{padding:8px 12px;border-radius:999px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px}
button.red{background:#e60023;color:#fff;border-color:#e60023}
button.on{background:#222;color:#fff;border-color:#222}
.group{border:2px solid #222;border-radius:14px;background:#fff;margin-top:14px;overflow:hidden}
.group-head{padding:14px 16px;background:#222;color:#fff;cursor:pointer}
.group-head h3{margin:0;font-size:16px}.group-head p{margin:4px 0 0;color:#ddd;font-size:13px}
.group-body{padding:4px 12px 12px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;display:none;z-index:9}
#login{max-width:380px;margin:80px auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#login input{width:100%;margin:10px 0}
#main{display:none}
.hint{color:#666;font-size:13px;background:#fffbe6;border:1px solid #ffe58f;border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<div id="toast"></div>

<div id="login">
<h2 style="margin:0">🔒 后台登录</h2>
<p style="color:#666;font-size:14px">请输入后台密码（服务器上 ADMIN_PASSWORD 设置的那个）。</p>
<input id="pw" type="password" placeholder="后台密码" onkeydown="if(event.key==='Enter')doLogin()">
<button class="red" style="width:100%;padding:12px" onclick="doLogin()">进入后台</button>
<p id="loginErr" style="color:#e60023"></p>
<p style="color:#888;font-size:12px">第一次部署请先在服务器上改掉默认密码，见 README.md。</p>
</div>

<div class="wrap" id="main">
<h1>📋 订单后台 <span class="live"><i></i><span id="liveText">实时同步中</span></span></h1>
<p style="color:#666">这个页面只给你自己看，别把这个链接和密码发给客户。客户只发首页链接。</p>
<p class="hint">📌 已按「演唱会名 + 场次时间」统一分类：名字大差不差的归一类（去空格、标点、年份和“演唱会/巡回演唱会”等后缀），同一场次归一类。不同场次、不同演唱会会分开显示。</p>
<div class="bar">
<button id="viewGroupBtn" class="on">按场次分组</button>
<button id="viewListBtn">全部列表</button>
<span>待处理 <span class="badge" id="pendingCount">0</span></span>
<span>全部 <span id="totalCount">0</span> 单</span>
<span id="groupCount"></span>
</div>
<div class="bar">
<select id="groupFilter" style="flex:1;min-width:200px"><option value="">全部分组</option></select>
<input id="q" placeholder="搜索演唱会 / 姓名 / 电话" style="flex:1;min-width:180px">
<select id="statusFilter">
<option value="">全部状态</option><option>待处理</option><option>已确认</option><option>已出票</option><option>已取消</option>
</select>
<button id="refreshBtn">刷新</button>
<button id="exportBtn">导出 CSV 备份</button>
<button onclick="sessionStorage.removeItem('adminPw');location.reload()">退出登录</button>
</div>
<div id="list"></div>
<p id="empty" style="color:#888;text-align:center;margin-top:30px">暂无订单，等客户提交后这里会自动出现。</p>
</div>

<script>
let orders = [], knownIds = new Set();
let viewMode = 'group';
const collapsed = new Set();
const $ = id => document.getElementById(id);
const pw = () => sessionStorage.getItem('adminPw') || '';
const headers = () => ({ 'x-admin-password': pw()});
function maskId(s){ s=String(s||''); return s.length>10? s.slice(0,6)+'********'+s.slice(-4): s;}
// 和 server.js 同一套归一化规则，老订单没有 groupKey 也能分组
function normalizeConcert(name){
let s = String(name||'').trim().toLowerCase();
s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
s = s.replace(/[\s\-_·•・、，。,！!？?（）()\[\]《》""''“”‘’\/\\|@#$%^&*+=~`]/g,'');
s = s.replace(/20\d{2}|19\d{2}/g,'');
const suffixes = ['世界巡回演唱会','巡回演唱会','世界巡演','巡回演唱','演唱会','巡演','演唱','世界巡回','全球巡回','巡回','live','tour','concert'];
let changed=true; while(changed){ changed=false; for(const w of suffixes){ if(s.endsWith(w)){ s=s.slice(0,-w.length); changed=true;}}}
return s || String(name||'').trim();
}
function normalizeDatetime(dt){
const s = String(dt||'').trim().replace(/\//g,'-').replace('T',' ');
const m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})/);
if(!m) return s;
const pad = n => String(n).padStart(2,'0');
return `${m[1]}-${pad(m[2])}-${pad(m[3])} ${pad(m[4])}:${m[5]}`;
}
function groupKeyFor(o){ return (o.groupKey || (normalizeConcert(o.concert)+'|'+normalizeDatetime(o.datetime)));}
function sameConcert(a, b){ return a === b || a.startsWith(b) || b.startsWith(a); }
function buildGroups(list){
const map = new Map();
for(const o of list){
const key = groupKeyFor(o);
const session = normalizeDatetime(o.datetime);
const concertKey = normalizeConcert(o.concert);
let g = null;
for(const cand of map.values()){ if(cand.session === session && sameConcert(cand.concertKey, concertKey)){ g = cand; break; } }
if(!g){ g = { key, concertKey, session, concert: o.concert, orders: []}; map.set(key, g); }
g.orders.push(o);
}
for(const g of map.values()){
const counts = {};
g.orders.forEach(o => counts[o.concert]=(counts[o.concert]||0)+1);
g.concert = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
g.count = g.orders.length;
g.tickets = g.orders.reduce((a,o)=>a+(Number(o.quantity)||0),0);
g.total = g.orders.reduce((a,o)=>a+(Number(o.total)||0),0);
g.pending = g.orders.filter(o=>o.status==='待处理').length;
g.orders.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}
return [...map.values()].sort((a,b)=>a.session.localeCompare(b.session));
}
function five(o){
return ['场次：'+o.datetime,'价位：'+o.priceTier+' ¥'+Number(o.unitPrice).toLocaleString()+'/张 × '+o.quantity+' 张','姓名：'+o.name,'身份证：'+o.idNumber,'电话：'+o.phone].join('\n');
}
function full(o){
return '订单号：'+o.id+'\n演唱会：'+o.concert+'\n场次：'+o.datetime+'\n'+five(o)+'\n合计：¥'+Number(o.total).toLocaleString()+'\n状态：'+o.status+'\n下单时间：'+new Date(o.createdAt).toLocaleString();
}
async function copyText(t, btn){
try { await navigator.clipboard.writeText(t);} catch { const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();}
if (btn){ const old=btn.textContent; btn.textContent='已复制 ✓'; setTimeout(()=>btn.textContent=old,1500);}
}
function showToast(t){ const el=$('toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none',3000);}

async function doLogin(){
const p = $('pw').value;
const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: p})});
if (!r.ok) { $('loginErr').textContent = '密码不对，请重试'; return;}
sessionStorage.setItem('adminPw', p);
enter();
}
window.doLogin = doLogin;
function enter(){
$('login').style.display = 'none'; $('main').style.display = 'block';
startSSE(); load();
}
async function load(){
try {
const r = await fetch('/api/orders', { headers: headers()});
if (r.status === 401) { sessionStorage.removeItem('adminPw'); location.reload(); return;}
orders = await r.json();
const isNew = orders.some(o =>!knownIds.has(o.id));
if (isNew && knownIds.size) showToast('🔔 来了新订单！');
knownIds = new Set(orders.map(o=>o.id));
render();
} catch { $('liveText').textContent = '连接失败，正在重试…';}
}
function filtered(){
const q = $('q').value.trim(), f = $('statusFilter').value;
return orders.filter(o => (!f || o.status===f) && (!q || (o.concert+o.name+o.phone+o.id).includes(q)));
}
function orderCard(o){
return `<div class="card ${o.status==='待处理'? 'new': ''}">
<h3>${o.concert} ${o.status==='待处理'? '<span class="badge">新订单</span>': ''}</h3>
<div class="meta">
订单号：<b>${o.id}</b> ｜ 状态：<b>${o.status}</b><br>
场次：<b>${o.datetime}</b><br>
价位：<b>${o.priceTier} ¥${Number(o.unitPrice).toLocaleString()}/张 × ${o.quantity} 张</b> ｜ 合计：<b>¥${Number(o.total).toLocaleString()}</b><br>
姓名：<b>${o.name}</b> ｜ 身份证：<b>${maskId(o.idNumber)}</b> ｜ 电话：<b>${o.phone}</b><br>
座位：${o.seat||'-'} ｜ 备注：${o.note||'-'}<br>
下单时间：${new Date(o.createdAt).toLocaleString()}
</div>
<div class="btns">
<button class="red" onclick="copyOne('${o.id}')">一键复制</button>
<button onclick="copyFull('${o.id}')">复制完整订单</button>
${['待处理','已确认','已出票','已取消'].map(s=>`<button class="${o.status===s?'on':''}" onclick="setStatus('${o.id}','${s}')">${s}</button>`).join('')}
<button onclick="delOne('${o.id}')" style="color:#e60023">删除</button>
</div>
</div>`;
}
function render(){
const list = filtered();
$('pendingCount').textContent = orders.filter(o=>o.status==='待处理').length;
$('totalCount').textContent = orders.length;
const groups = buildGroups(list);
$('groupCount').textContent = `共 ${groups.length} 个场次分组`;
const sel = $('groupFilter');
const cur = sel.value;
sel.innerHTML = '<option value="">全部分组</option>' + buildGroups(orders).map(g => `<option value="${g.key}">${g.concert} ${g.session}（${g.count}单）</option>`).join('');
sel.value = cur;
const showGroups = groups.filter(g =>!cur || g.key === cur);
$('empty').style.display = list.length? 'none': 'block';
if (viewMode === 'list') {
$('list').innerHTML = list.map(orderCard).join('');
return;
}
$('list').innerHTML = showGroups.map(g => `
<div class="group">
<div class="group-head" onclick="toggleGroup('${encodeURIComponent(g.key)}')">
<h3>${g.concert} ${g.pending? `<span class="badge">${g.pending} 待处理</span>`: ''}</h3>
<p>场次：${g.session} ｜ ${g.count} 单 ｜ ${g.tickets} 张 ｜ 合计 ¥${g.total.toLocaleString()} ｜ ${collapsed.has(g.key)? '点击展开 ▶': '点击收起 ▼'}</p>
</div>
${collapsed.has(g.key)? '': `<div class="group-body">
<div class="btns"><button class="red" onclick="copyGroup('${encodeURIComponent(g.key)}')">复制本场汇总</button></div>
${g.orders.map(orderCard).join('')}
</div>`}
</div>`).join('');
}
window.toggleGroup = k => { k = decodeURIComponent(k); collapsed.has(k)? collapsed.delete(k): collapsed.add(k); render();};
window.copyGroup = k => {
k = decodeURIComponent(k);
const g = buildGroups(filtered()).find(x => x.key === k);
if (!g) return;
const lines = [`${g.concert} ${g.session}`, `共 ${g.count} 单 / ${g.tickets} 张 / 合计 ¥${g.total.toLocaleString()}`, ''];
g.orders.forEach(o => lines.push(`${o.name} ${o.priceTier} ¥${o.unitPrice}×${o.quantity} ${o.phone} ${o.status}`));
copyText(lines.join('\n'), event.target);
};
window.copyOne = id => { const o=orders.find(x=>x.id===id); copyText(five(o), event.target);};
window.copyFull = id => { const o=orders.find(x=>x.id===id); copyText(full(o), event.target);};
window.setStatus = async (id, status) => { await fetch('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({status})}); load();};
window.delOne = async id => { if(!confirm('确定删除这单吗？')) return; await fetch('/api/orders/'+id,{method:'DELETE',headers:headers()}); load();};
$('q').addEventListener('input', render);
$('statusFilter').addEventListener('change', render);
$('groupFilter').addEventListener('change', render);
$('viewGroupBtn').onclick = () => { viewMode='group'; $('viewGroupBtn').classList.add('on'); $('viewListBtn').classList.remove('on'); render();};
$('viewListBtn').onclick = () => { viewMode='list'; $('viewListBtn').classList.add('on'); $('viewGroupBtn').classList.remove('on'); render();};
$('refreshBtn').onclick = () => load();
$('exportBtn').onclick = () => {
const a = document.createElement('a');
a.href = '/api/orders/export?password=' + encodeURIComponent(pw());
a.download = 'orders.csv'; a.click();
};
function startSSE(){
try {
const es = new EventSource('/api/stream?password=' + encodeURIComponent(pw()));
es.onmessage = () => load();
es.onerror = () => { $('liveText').textContent = '实时连接断开，自动轮询中…';};
} catch {}
}
setInterval(() => { if (pw()) load();}, 3000);
if (pw()) enter();
</script>
</body>
</html>
